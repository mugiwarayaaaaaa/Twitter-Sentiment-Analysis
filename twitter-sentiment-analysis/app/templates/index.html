<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border: none; border-radius: 1rem; }
        textarea { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; }
        textarea:focus { background: #0f172a; color: #e2e8f0; border-color: #2563eb; box-shadow: none; }
        .badge-positive { background: #16a34a; }
        .badge-negative { background: #dc2626; }
        .badge-neutral { background: #64748b; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="mb-1">🐦 Twitter Sentiment Analysis</h2>
            <p class="text-secondary mb-4">TF-IDF + Logistic Regression &mdash; trained on 25,000 tweets, ~87% test accuracy</p>

            <div class="card p-4">
                <form method="POST">
                    <textarea name="text" rows="4" class="form-control mb-3" placeholder="Paste a tweet here...">{{ text }}</textarea>
                    <button type="submit" class="btn btn-primary">Analyze Sentiment</button>
                </form>

                {% if result %}
                <div class="mt-4 p-3 rounded" style="background:#0f172a;">
                    <span class="badge badge-{{ result.label }} fs-6 px-3 py-2">{{ result.label|upper }}</span>
                    <span class="text-secondary ms-2">{{ result.confidence }}% confidence</span>
                </div>
                {% endif %}
            </div>

            <p class="text-secondary small mt-4">
                Model artifacts loaded from <code>models/</code>. Run <code>python src/train.py</code> first if they don't exist yet.
            </p>
        </div>
    </div>
</div>
</body>
</html>
